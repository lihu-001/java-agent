# 使用 UTF-8 编码。复制为项目根目录的 config.properties 后填写。
# API 基础地址，程序自动追加 /chat/completions。
openai.base-url=https://api.openai.com/v1
# 填写服务商提供的模型 ID 和 API 密钥，不要加引号。
openai.model=
openai.api-key=
# S01 / S02 共用配置，以下均可省略，默认值如下。
# Windows 路径建议使用正斜杠，例如 C:/work/playground。
agent.work-dir=playground
agent.max-model-calls=10
shell.timeout-seconds=30
shell.max-output-chars=12000
