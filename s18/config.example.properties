# UTF-8。复制为当前运行目录的 config.properties 后填写。
openai.base-url=https://api.openai.com/v1
openai.model=
openai.api-key=

agent.work-dir=playground
agent.max-model-calls=10
shell.timeout-seconds=30
shell.max-output-chars=12000

# S08 上下文压缩：粗略字符数（非 token）超过阈值时自动总结；最近 N 个工具结果保留原文。
compact.threshold-chars=50000
compact.keep-tool-results=3

# S11 后台任务：background_run 启动的命令单独超时（秒），超时后终止进程树。
background.timeout-seconds=600

# S12 定时计划：调度线程轮询间隔（秒），计划最短触发精度为一分钟。
scheduler.poll-seconds=15

# S13 团队模式：默认关闭，与 S12 单 Agent 相同；设为 true 后 Lead 可创建常驻队友（每个队友独立调用模型，费用更高）。
team.enabled=false

# S15 集成 Harness：限流退避（默认 3 次）与响应式压缩为内置行为，无配置项；
# 定时计划终态会送达对话并唤醒循环，后台完成只唤醒。哨兵轮中的权限确认自动拒绝。

# S17 Goal Loop：/goal 设置完成条件后，每轮最多自动续跑的次数（判断器连续认为未完成），超过后交还给用户。
# 自动续跑与正常工具调用共用 agent.max-model-calls；目标需要较多步骤时可一并调大。
goal.block-cap=8
# 判断器使用的模型，留空则与 openai.model 相同（同一 base-url 与 api-key）。
goal.evaluator-model=

# S18 斜杠命令：无配置项。终端输入 /help 查看全部命令；本地命令不请求模型、不触发 Hook。
